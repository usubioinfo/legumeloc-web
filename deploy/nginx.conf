map $request_method $legumeloc_predict_key { POST $binary_remote_addr; default ""; }
map $request_method $legumeloc_status_key { GET $binary_remote_addr; default ""; }
limit_req_zone $legumeloc_predict_key zone=legumeloc_predict:10m rate=1r/m;
limit_req_zone $binary_remote_addr zone=legumeloc_api:10m rate=10r/m;
limit_req_zone $legumeloc_status_key zone=legumeloc_status:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=legumeloc_conn:10m;

server {
    listen 3220;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 20s;
    limit_req_status 429;
    limit_conn_status 429;

    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    location = /legumeloc/api/predict {
        limit_conn legumeloc_conn 3;
        limit_req zone=legumeloc_predict burst=2 nodelay;
        limit_req zone=legumeloc_status burst=10 nodelay;
        proxy_pass http://app:3220;
    }

    location ~ ^/legumeloc/api/(accession|fasta-check)$ {
        limit_req zone=legumeloc_api burst=5 nodelay;
        limit_conn legumeloc_conn 5;
        proxy_pass http://app:3220;
    }

    # /download is a Next.js page. Match it exactly so Nginx does not append
    # a slash and expose the internal gateway port in the redirect URL.
    location = /legumeloc/download {
        proxy_pass http://app:3220;
    }

    location ^~ /legumeloc/download/ {
        limit_conn legumeloc_conn 1;
        limit_rate_after 10m;
        limit_rate 20m;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_pass http://app:3220;
    }

    location / {
        limit_conn legumeloc_conn 20;
        proxy_pass http://app:3220;
    }
}
